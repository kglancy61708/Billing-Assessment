<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Assessment</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f9; color: #1a2332; font-size: 14px; line-height: 1.5;
    }
    button { cursor: pointer; font: inherit; border: none; background: none; }
    a { color: #1a56db; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Header */
    .header {
      background: #fff; border-bottom: 1px solid #e2e6ea;
      padding: 20px 28px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .header-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
    h1 { font-size:22px; font-weight:700; }
    .subtitle { font-size:12px; color:#6b7a8d; margin-top:2px; }
    .btn-scan {
      background:#1a56db; color:#fff; padding:8px 18px;
      border-radius:6px; font-weight:600; font-size:13px;
    }
    .btn-scan:hover { background:#1649c0; }
    .stat-row { display:flex; gap:28px; margin-bottom:14px; }
    .stat-val { font-size:28px; font-weight:700; line-height:1; }
    .stat-label { font-size:12px; color:#6b7a8d; margin-top:2px; }
    .rule-row { display:flex; flex-wrap:wrap; gap:8px; }
    .rule-pill {
      display:flex; align-items:center; gap:6px;
      background:#f3f4f6; border-radius:20px; padding:3px 10px 3px 8px; font-size:12px;
      cursor:pointer; border:2px solid transparent; transition:border-color 0.15s, background 0.15s;
    }
    .rule-pill:hover { background:#e5e7eb; }
    .rule-pill.active { background:#eff6ff; border-color:#1a56db; }
    .rule-pill.active .rule-num { color:#1a56db; }
    .rule-pill.active .rule-count { background:#1a56db; color:#fff; }
    .rule-num { font-weight:700; color:#374151; }
    .rule-count {
      background:#e5e7eb; border-radius:10px; padding:0 6px;
      font-weight:700; color:#111827;
    }
    .rule-lbl { color:#6b7280; }

    /* Toolbar */
    .toolbar {
      display:flex; align-items:center; gap:10px; padding:16px 28px 12px;
      flex-wrap:wrap;
    }
    .search, .select-filter {
      border:1px solid #d1d5db; border-radius:6px; padding:7px 12px;
      font-size:13px; outline:none; background:#fff;
    }
    .search { min-width:220px; }
    .result-count { margin-left:auto; font-size:13px; color:#6b7280; }

    /* Flag cards */
    .flags { padding:0 28px 28px; }
    .card {
      background:#fff; border-radius:8px;
      box-shadow:0 1px 3px rgba(0,0,0,.07);
      overflow:hidden; margin-bottom:8px;
      border-left:4px solid #ccc;
    }
    .card-header {
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 16px; cursor:pointer; user-select:none;
    }
    .card-header:hover { background:#fafafa; }
    .card-left { display:flex; align-items:center; gap:10px; }
    .chevron { font-size:16px; color:#9ca3af; width:16px; }
    .company { font-weight:600; font-size:14px; }
    .meta { font-size:12px; color:#6b7a8d; margin-top:2px; }
    .parent-tag {
      background:#e5e7eb; border-radius:4px; padding:1px 6px;
      margin-left:8px; font-size:11px;
    }
    .category-tag {
      background:#dbeafe; color:#1e40af; border-radius:4px; padding:1px 7px;
      margin-left:8px; font-size:11px; font-weight:500;
    }
    .card-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .rule-tag {
      background:#e0e7ff; color:#3730a3; border-radius:4px;
      padding:2px 8px; font-size:11px; font-weight:700;
    }
    .status-badge { border-radius:12px; padding:2px 10px; font-size:12px; font-weight:600; }
    .status-open    { background:#fef3c7; color:#92400e; }
    .status-reviewed  { background:#d1fae5; color:#065f46; }
    .status-dismissed { background:#f3f4f6; color:#6b7280; }
    .ns-link { font-size:12px; font-weight:500; white-space:nowrap; }

    /* Expanded body */
    .card-body { border-top:1px solid #f3f4f6; padding:14px 20px 16px; display:none; }
    .card-body.open { display:block; }
    .rule-label { font-weight:700; font-size:13px; margin-bottom:4px; color:#374151; }
    .detail { font-size:13px; color:#4b5563; margin-bottom:12px; }
    .field-box {
      background:#f9fafb; border-radius:6px; padding:10px 12px;
      margin-bottom:14px; font-size:13px;
    }
    .field-row { display:flex; gap:8px; margin-bottom:3px; }
    .field-key { color:#6b7280; min-width:140px; }
    .field-val { color:#111827; font-family:monospace; }
    .field-miss { color:#dc2626; font-weight:500; }
    .review-form { border-top:1px solid #f3f4f6; padding-top:12px; }
    .form-row { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
    .form-label { font-size:12px; font-weight:600; color:#374151; }
    .form-input {
      border:1px solid #d1d5db; border-radius:6px; padding:6px 10px;
      font-size:13px; outline:none; max-width:300px; font:inherit;
    }
    .form-textarea {
      border:1px solid #d1d5db; border-radius:6px; padding:6px 10px;
      font-size:13px; resize:vertical; outline:none; font:inherit; width:100%;
    }
    .actions { display:flex; gap:8px; margin-top:4px; }
    .action-btn { padding:6px 14px; border-radius:6px; font-weight:600; font-size:13px; }
    .btn-reviewed { background:#d1fae5; color:#057a55; }
    .btn-dismiss  { background:#f3f4f6; color:#6b7280; }
    .btn-reopen   { background:#dbeafe; color:#1a56db; }
    .reviewed-info { font-size:12px; color:#6b7280; margin-bottom:8px; }
    .saved-toast {
      display:inline-block; background:#d1fae5; color:#065f46;
      border-radius:6px; padding:3px 10px; font-size:12px; font-weight:600;
      margin-left:10px; opacity:0; transition:opacity 0.3s;
    }
    .saved-toast.show { opacity:1; }

    /* Tables */
    table { width:100%; border-collapse:collapse; margin-top:6px; }
    th { text-align:left; font-weight:600; color:#374151; padding:4px 8px;
         border-bottom:1px solid #e5e7eb; font-size:12px; }
    td { padding:4px 8px; border-bottom:1px solid #f3f4f6;
         color:#374151; font-family:monospace; font-size:12px; }

    /* Parent groups */
    .parent-group { margin-bottom:20px; }
    .parent-group-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 14px; background:#e8edf5; border-radius:8px 8px 0 0;
      border:1px solid #c9d4e8; cursor:pointer; user-select:none;
    }
    .parent-group-header:hover { background:#dce4f0; }
    .parent-group-title { font-weight:700; font-size:13px; color:#1e3a5f; display:flex; align-items:center; gap:8px; }
    .parent-group-meta { font-size:12px; color:#4b6589; }
    .parent-group-count {
      background:#1a56db; color:#fff; border-radius:12px;
      padding:1px 8px; font-size:12px; font-weight:700;
    }
    .parent-group-body { border:1px solid #c9d4e8; border-top:none; border-radius:0 0 8px 8px; overflow:hidden; }
    .parent-group-body .card { border-radius:0; margin-bottom:0; border-bottom:1px solid #f0f0f0; box-shadow:none; }
    .parent-group-body .card:last-child { border-bottom:none; }
    .parent-group-body.collapsed { display:none; }

    /* Edit panels */
    .edit-panel { border-top:1px solid #e5e7eb; margin-top:14px; padding-top:14px; }
    .edit-panel-header { font-weight:700; font-size:13px; color:#374151; margin-bottom:10px; }
    .edit-section { margin-bottom:14px; }
    .edit-section-label { font-size:11px; font-weight:700; text-transform:uppercase; color:#6b7280; letter-spacing:.05em; margin-bottom:6px; }
    .edit-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
    .edit-row label { font-size:12px; color:#374151; min-width:140px; }
    .edit-input {
      border:1px solid #d1d5db; border-radius:5px; padding:5px 9px;
      font-size:13px; outline:none; font:inherit; max-width:280px; width:100%;
    }
    .edit-input:focus { border-color:#1a56db; }
    .edit-select {
      border:1px solid #d1d5db; border-radius:5px; padding:5px 9px;
      font-size:13px; outline:none; font:inherit; max-width:280px; width:100%; background:#fff;
    }
    .edit-checkbox { width:16px; height:16px; cursor:pointer; }
    .btn-save-ns {
      background:#1a56db; color:#fff; padding:6px 14px; border-radius:6px;
      font-weight:600; font-size:12px; margin-top:4px;
    }
    .btn-save-ns:hover { background:#1649c0; }
    .edit-status { font-size:12px; margin-left:10px; }
    .edit-status.ok { color:#065f46; }
    .edit-status.err { color:#b91c1c; }
    .edit-loading { font-size:12px; color:#6b7280; font-style:italic; padding:6px 0; }
    .sibling-emails-list { font-size:13px; color:#374151; margin-bottom:8px; }
    .sibling-emails-list li { list-style:none; padding:2px 0; font-family:monospace; }
    .invoice-edit-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
    .invoice-edit-row .inv-label { font-size:12px; color:#6b7280; min-width:200px; }
  </style>
</head>
<body>

<div id="app">
  <!-- Header injected by JS -->
</div>

<script>
const RULE_COLORS = { 1:'#dbeafe', 2:'#fce7f3', 3:'#ffedd5', 4:'#ede9fe', 5:'#fef9c3', 6:'#dcfce7' };

const FIELD_LABELS = {
  printtransactions: 'Print Transactions',
  custentity264: 'Invoices to Email',
  custentity310: 'Online Invoice Service',
  custentity562: 'Invoice Email #1',
  custentity563: 'Invoice Email #2',
  custentity594: 'Print Statements',
  custentity571: 'Statements to Email',
  custentity531: 'Statement Email #1',
  custentity532: 'Statement Email #2',
  email: 'Email',
  custentity_po_required: 'PO Required',
  otherrefnum: 'PO Number',
};

// Cache for B2B systems fetched from server
let b2bSystemsCache = null;

const US_STATES = [
  ['','— select state —'],
  ['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],['CA','California'],
  ['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],['DC','District of Columbia'],
  ['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],['IL','Illinois'],
  ['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],['KY','Kentucky'],['LA','Louisiana'],
  ['ME','Maine'],['MD','Maryland'],['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],
  ['MS','Mississippi'],['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],
  ['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],
  ['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],
  ['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],['SD','South Dakota'],
  ['TN','Tennessee'],['TX','Texas'],['UT','Utah'],['VT','Vermont'],['VA','Virginia'],
  ['WA','Washington'],['WV','West Virginia'],['WI','Wisconsin'],['WY','Wyoming'],
  ['PR','Puerto Rico'],['VI','Virgin Islands'],['GU','Guam'],
  ['AB','Alberta'],['BC','British Columbia'],['MB','Manitoba'],['NB','New Brunswick'],
  ['NL','Newfoundland'],['NS','Nova Scotia'],['ON','Ontario'],['PE','Prince Edward Island'],
  ['QC','Quebec'],['SK','Saskatchewan'],
];

function renderStateSelect(elemId, currentVal) {
  const opts = US_STATES.map(([abbr, name]) =>
    `<option value="${abbr}" ${abbr === currentVal ? 'selected' : ''}>${abbr ? abbr + ' — ' + name : name}</option>`
  ).join('');
  return `<select class="edit-select" id="${elemId}" style="max-width:220px">${opts}</select>`;
}

function parseBool(v) {
  if (v === true || v === 'T') return true;
  if (v === false || v === 'F') return false;
  return null;
}

function boolChecked(v) { return parseBool(v) === true; }

function editStatusSpan(id) {
  return `<span class="edit-status" id="${id}-estatus"></span>`;
}

function setEditStatus(id, ok, msg) {
  const el = document.getElementById(id + '-estatus');
  if (!el) return;
  el.textContent = ok ? ('✓ ' + (msg || 'Saved')) : ('✗ ' + (msg || 'Error'));
  el.className = 'edit-status ' + (ok ? 'ok' : 'err');
}

async function fetchB2BSystems() {
  if (b2bSystemsCache) return b2bSystemsCache;
  try {
    b2bSystemsCache = await fetch('/api/b2bsystems').then(r => r.json());
  } catch(e) { b2bSystemsCache = []; }
  return b2bSystemsCache;
}

// Lazy-load customer fields; cache on the flag object
async function loadEditFields(f, fieldList, panelId) {
  if (f._editFields) return f._editFields;
  const loadingEl = document.getElementById(panelId + '-loading');
  if (loadingEl) loadingEl.style.display = 'block';
  try {
    const data = await fetch(`/api/customer/${f.customerId}/fields?fields=${fieldList}`).then(r => r.json());
    f._editFields = data;
    if (loadingEl) loadingEl.style.display = 'none';
    populateEditFields(f, panelId);
    return data;
  } catch(e) {
    if (loadingEl) { loadingEl.textContent = 'Failed to load current values.'; }
    return null;
  }
}

function populateEditFields(f, panelId) {
  const d = f._editFields;
  if (!d) return;
  const fields = ['printtransactions','custentity264','custentity571','custentity594',
                  'email','custentity562','custentity563','custentity531','custentity532'];
  for (const key of fields) {
    const el = document.getElementById(`${panelId}-ef-${key}`);
    if (!el) continue;
    const val = d[key];
    if (el.type === 'checkbox') {
      el.checked = (val === true || val === 'T' || (val && val.refName === 'Yes'));
    } else {
      // list field with refName or plain string
      el.value = (val && typeof val === 'object') ? (val.refName || '') : (val || '');
    }
  }
}

function collectEditFields(panelId, keys) {
  const out = {};
  for (const key of keys) {
    const el = document.getElementById(`${panelId}-ef-${key}`);
    if (!el) continue;
    if (el.type === 'checkbox') {
      out[key] = el.checked;
    } else {
      out[key] = el.value;
    }
  }
  return out;
}

async function saveCustomerFields(customerId, fields, statusId) {
  try {
    const res = await fetch(`/api/customer/${customerId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields }),
    }).then(r => r.json());
    if (res.error) throw new Error(res.error);
    setEditStatus(statusId, true, 'Saved to NetSuite');
  } catch(e) {
    setEditStatus(statusId, false, e.message);
  }
}

async function saveTransactionField(transactionId, fields, statusId) {
  try {
    const res = await fetch(`/api/transaction/${transactionId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields }),
    }).then(r => r.json());
    if (res.error) throw new Error(res.error);
    setEditStatus(statusId, true, 'Saved');
  } catch(e) {
    setEditStatus(statusId, false, e.message);
  }
}

async function saveAddressFields(customerId, addressbookId, fields, statusId) {
  try {
    const res = await fetch(`/api/customer/${customerId}/address/${addressbookId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields }),
    }).then(r => r.json());
    if (res.error) throw new Error(res.error);
    setEditStatus(statusId, true, 'Saved to NetSuite');
  } catch(e) {
    setEditStatus(statusId, false, e.message);
  }
}

function renderEditPanel(f) {
  const id = `card-${f.customerId}-${f.ruleId}`;

  if (f.ruleId === 1) {
    return `
      <div class="edit-panel">
        <div class="edit-panel-header">Edit in NetSuite</div>
        <div class="edit-section">
          <div class="edit-row">
            <label>Online Invoice Service</label>
            <input type="checkbox" class="edit-checkbox" id="${id}-ef-custentity310" checked />
          </div>
          <div class="edit-row">
            <label>B2B System</label>
            <select class="edit-select" id="${id}-ef-custentity318"><option value="">Loading…</option></select>
          </div>
          <button class="btn-save-ns" onclick="saveRule1('${f.customerId}','${id}')">Save to NetSuite</button>
          ${editStatusSpan(id)}
        </div>
      </div>`;
  }

  if (f.ruleId === 2) {
    const fv = f.fields || {};
    return `
      <div class="edit-panel">
        <div class="edit-panel-header">Edit in NetSuite</div>
        <div class="edit-section">
          <div class="edit-section-label">Invoice</div>
          <div class="edit-row"><label>${FIELD_LABELS.printtransactions}</label><input type="checkbox" class="edit-checkbox" id="${id}-ef-printtransactions" ${boolChecked(fv.printtransactions)?'checked':''} /></div>
          <div class="edit-row"><label>${FIELD_LABELS.custentity264}</label><input type="checkbox" class="edit-checkbox" id="${id}-ef-custentity264" ${boolChecked(fv.custentity264)?'checked':''} /></div>
          <div class="edit-row"><label>${FIELD_LABELS.custentity562}</label><input type="text" class="edit-input" id="${id}-ef-custentity562" value="${escHtml(fv.custentity562||'')}" /></div>
          <div class="edit-row"><label>${FIELD_LABELS.custentity563}</label><input type="text" class="edit-input" id="${id}-ef-custentity563" value="${escHtml(fv.custentity563||'')}" /></div>
        </div>
        <div class="edit-section">
          <div class="edit-section-label">Statement</div>
          <div class="edit-row"><label>${FIELD_LABELS.custentity594}</label><input type="checkbox" class="edit-checkbox" id="${id}-ef-custentity594" ${boolChecked(fv.custentity594)?'checked':''} /></div>
          <div class="edit-row"><label>${FIELD_LABELS.custentity571}</label><input type="checkbox" class="edit-checkbox" id="${id}-ef-custentity571" ${boolChecked(fv.custentity571)?'checked':''} /></div>
          <div class="edit-row"><label>${FIELD_LABELS.custentity531}</label><input type="text" class="edit-input" id="${id}-ef-custentity531" value="${escHtml(fv.custentity531||'')}" /></div>
          <div class="edit-row"><label>${FIELD_LABELS.custentity532}</label><input type="text" class="edit-input" id="${id}-ef-custentity532" value="${escHtml(fv.custentity532||'')}" /></div>
        </div>
        <div class="edit-section">
          <div class="edit-section-label">General</div>
          <div class="edit-row"><label>${FIELD_LABELS.email}</label><input type="text" class="edit-input" id="${id}-ef-email" value="${escHtml(fv.email||'')}" /></div>
        </div>
        <button class="btn-save-ns" onclick="saveRule2('${f.customerId}','${id}')">Save to NetSuite</button>
        ${editStatusSpan(id)}
      </div>`;
  }

  if (f.ruleId === 3) {
    const fv = f.fields || {};
    return `
      <div class="edit-panel">
        <div class="edit-panel-header">Edit in NetSuite</div>
        <div class="edit-section">
          <div class="edit-section-label">Invoice</div>
          <div class="edit-row"><label>${FIELD_LABELS.custentity264}</label><input type="checkbox" class="edit-checkbox" id="${id}-ef-custentity264" ${boolChecked(fv.custentity264)?'checked':''} /></div>
          <div class="edit-row"><label>${FIELD_LABELS.custentity562}</label><input type="text" class="edit-input" id="${id}-ef-custentity562" value="${escHtml(fv.custentity562||'')}" /></div>
          <div class="edit-row"><label>${FIELD_LABELS.custentity563}</label><input type="text" class="edit-input" id="${id}-ef-custentity563" value="${escHtml(fv.custentity563||'')}" /></div>
        </div>
        <div class="edit-section">
          <div class="edit-section-label">General</div>
          <div class="edit-row"><label>${FIELD_LABELS.email}</label><input type="text" class="edit-input" id="${id}-ef-email" value="${escHtml(fv.email||'')}" /></div>
        </div>
        <button class="btn-save-ns" onclick="saveRule3('${f.customerId}','${id}')">Save to NetSuite</button>
        ${editStatusSpan(id)}
      </div>`;
  }

  if (f.ruleId === 4) {
    const siblings = f.fields?.siblingEmails || [];
    const sibHtml = siblings.length
      ? `<ul class="sibling-emails-list">${siblings.map(s => `<li>${s.companyname}: ${s.email}</li>`).join('')}</ul>`
      : `<p style="font-size:12px;color:#6b7280;font-style:italic">No sibling emails found.</p>`;
    return `
      <div class="edit-panel">
        <div class="edit-panel-header">Edit in NetSuite</div>
        <div class="edit-section">
          <div class="edit-section-label">Sibling Account Emails (read-only)</div>
          ${sibHtml}
        </div>
        <div class="edit-section">
          <div class="edit-section-label">Correct this account's email</div>
          <div class="edit-row">
            <label>${FIELD_LABELS.email}</label>
            <input type="text" class="edit-input" id="${id}-ef-email" value="${f.fields?.email || ''}" />
          </div>
          <button class="btn-save-ns" onclick="saveRule4('${f.customerId}','${id}')">Save to NetSuite</button>
          ${editStatusSpan(id)}
        </div>
      </div>`;
  }

  if (f.ruleId === 5) {
    const invoices = f.fields?.invoices || [];
    const poRequired = boolChecked(f.fields?.custentity_po_required);
    return `
      <div class="edit-panel">
        <div class="edit-panel-header">Edit in NetSuite</div>
        <div class="edit-section">
          <div class="edit-section-label">Customer</div>
          <div class="edit-row">
            <label>${FIELD_LABELS.custentity_po_required}</label>
            <input type="checkbox" class="edit-checkbox" id="${id}-ef-custentity_po_required" ${poRequired ? 'checked' : ''} />
          </div>
          <button class="btn-save-ns" onclick="saveRule5Customer('${f.customerId}','${id}')">Save Customer to NetSuite</button>
          ${editStatusSpan(id + '-cust')}
        </div>
        <div class="edit-section">
          <div class="edit-section-label">Invoices — Enter PO Numbers</div>
          ${invoices.map((inv, idx) => `
            <div class="invoice-edit-row">
              <span class="inv-label">${inv.tranId} &nbsp; ${inv.tranDate}</span>

      if (!f.companyName?.toLowerCase().includes(q) && !f.customerId?.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

// Group filtered flags: parent accounts first (parentId null), then sub-accounts nested under their parent.
// Flags with no parent stand alone. Flags whose parent has other flags get grouped together.
function getGrouped(filtered) {
  const groups = [];
  const byParent = {};

  for (const f of filtered) {
    const key = f.parentId || '__standalone__' + f.customerId;
    if (!byParent[key]) byParent[key] = { parentId: f.parentId, flags: [] };
    byParent[key].flags.push(f);
  }

  for (const [key, group] of Object.entries(byParent)) {
    const isParentGroup = group.parentId != null;
    const parentName = isParentGroup
      ? (group.flags.find(f => f.parentName)?.parentName || `Parent ID ${group.parentId}`)
      : null;
    groups.push({
      parentId: group.parentId,
      parentName,
      flags: group.flags,
    });
  }

  // Sort: grouped (has parentId) first, then standalones; within each, sort by parentId then companyName
  groups.sort((a, b) => {
    if (a.parentId && !b.parentId) return -1;
    if (!a.parentId && b.parentId) return 1;
    if (a.parentId && b.parentId) return String(a.parentId).localeCompare(String(b.parentId));
    return (a.flags[0]?.companyName || '').localeCompare(b.flags[0]?.companyName || '');
  });

  return groups;
}

async function saveFlag(customerId, ruleId, status, cardId, parentId, ruleLabel) {
  const noteEl = document.getElementById(cardId+'-note');
  const note = noteEl?.value?.trim() || null;
  const reviewedBy = document.getElementById(cardId+'-reviewer')?.value || null;
  const addToNetSuite = status !== 'open' && (document.getElementById(cardId+'-ns-note')?.checked !== false);

  if (status === 'dismissed' && !note) {
    if (noteEl) { noteEl.style.borderColor = '#ef4444'; noteEl.placeholder = 'Note is required when dismissing'; noteEl.focus(); }
    return;
  }
  if (noteEl) noteEl.style.borderColor = '';

  try {
    const flag = flags.find(f => String(f.customerId)===String(customerId) && f.ruleId===ruleId);
    const flagMeta = flag ? {
      customerId: flag.customerId, companyName: flag.companyName,
      parentId: flag.parentId, parentName: flag.parentName,
      ruleId: flag.ruleId, ruleLabel: flag.ruleLabel,
      detail: flag.detail, fields: flag.fields,
    } : null;
    const result = await fetch(`/api/flags/${customerId}/${ruleId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, note, reviewedBy, parentId, addToNetSuite, companyName: flag?.companyName, ruleLabel, flagMeta }),
    }).then(r => r.json());

    if (flag) { flag.status = status; flag.note = note; flag.reviewedBy = reviewedBy; flag.reviewedAt = new Date().toISOString(); }

    const toast = document.getElementById(cardId+'-toast');
    if (toast) { toast.textContent = 'Saved ✓'; toast.classList.add('show'); }

    const nsToast = document.getElementById(cardId+'-ns-toast');
    if (nsToast && addToNetSuite) {
      if (result.netsuiteNoteError) {
        nsToast.textContent = '⚠ NetSuite note failed: ' + result.netsuiteNoteError;
        nsToast.style.background = '#fef2f2';
        nsToast.style.color = '#b91c1c';
      } else {
        nsToast.textContent = 'Note added to NetSuite ✓';
      }
      nsToast.classList.add('show');
    }

    setTimeout(() => renderAll(), 1200);
  } catch(err) {
    alert('Failed to save: ' + err.message);
  }
}

async function handleScan() {
  const btn = document.querySelector('.btn-scan');
  btn.textContent = '⟳ Scanning…';
  btn.disabled = true;
  btn.style.background = '#9ca3af';

  try {
    await fetch('/api/scan', { method: 'POST' });
    // Poll until scan completes
    for (let i = 0; i < 60; i++) {
      await new Promise(r => setTimeout(r, 2000));
      const st = await fetch('/api/scan/status').then(r => r.json());
      if (!st.scanning) break;
    }
    await loadFlags();
  } catch(err) {
    alert('Scan error: ' + err.message);
  } finally {
    btn.textContent = '↺ Run Scan';
    btn.disabled = false;
    btn.style.background = '';
  }
}

async function loadFlags() {
  isLoading = true;
  renderAll();
  try {
    // Always fetch all flags unfiltered; filtering is applied client-side in renderAll()
    const data = await fetch('/api/flags').then(r => r.json());
    flags = data.flags || [];
    scannedAt = data.scannedAt || null;
    scanErrors = data.errors || [];
  } catch(err) {
    console.error('Failed to load flags:', err);
  } finally {
    isLoading = false;
    renderAll();
  }
}

function renderGroup(group) {

    // Standalone flag — no group wrapper, just render the card directly
    return group.flags.map(renderCard).join('');
  }
  const gid = `group-${group.parentId}`;
  const openCount = group.flags.filter(f => f.status === 'open').length;
  return `
    <div class="parent-group">
      <div class="parent-group-header" onclick="toggleGroup('${gid}')">
        <div class="parent-group-title">
          <span class="chevron" id="${gid}-chev">▾</span>
          ${group.parentName}
          <span class="parent-group-count">${group.flags.length} flag${group.flags.length !== 1 ? 's' : ''}</span>
          ${openCount > 0 ? `<span style="font-size:12px;font-weight:600;color:#b45309">${openCount} open</span>` : ''}
        </div>
        <div class="parent-group-meta">Parent ID: ${group.parentId}</div>
      </div>
      <div class="parent-group-body" id="${gid}-body">
        ${group.flags.map(renderCard).join('')}
      </div>
    </div>`;
}

function renderAll() {
  const filtered = getFiltered();
  const groups = getGrouped(filtered);
  const empty = isLoading
    ? `<div style="text-align:center;color:#6b7280;padding:60px 0;font-size:15px">Loading flags…</div>`
    : filtered.length === 0
      ? `<div style="text-align:center;color:#6b7280;padding:60px 0;font-size:15px">${flags.length === 0 ? 'No flags found. Click Run Scan to check your accounts.' : 'No flags match the current filters.'}</div>`
      : '';
  document.getElementById('app').innerHTML =
    renderHeader() +
    renderToolbar() +
    `<div class="flags">${empty}${groups.map(renderGroup).join('')}</div>`;
}

// Initial load
loadFlags();
</script>
</body>
</html>
